<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>graft viz</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="appbar">
  <div class="brand"><b>graft</b><span id="repoName"></span></div>
  <div class="counts" id="counts"></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" aria-selected="true" data-tab="context">Context</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="code">Code</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="outline">Outline</button>
  </nav>
  <div class="searchbox">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="search" placeholder="Search nodes…" aria-label="Search nodes">
  </div>
  <button class="iconbtn" id="pickerToggleAppbar" title="Toggle files sidebar" aria-label="Toggle files sidebar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
  </button>
  <button class="iconbtn" id="themeBtn" title="Toggle theme" aria-label="Toggle theme">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>

<main class="stage" id="stage">
  <aside class="picker-panel" id="pickerPanel" aria-label="Files and directories">
    <div class="picker-header">
      <div class="picker-title">
        <b>Files</b>
        <span class="picker-stats" id="pickerStats"></span>
      </div>
      <div class="picker-tools">
        <button type="button" class="ptool-btn" id="pickerAll" title="Select all files">all</button>
        <button type="button" class="ptool-btn" id="pickerNone" title="Deselect all files">none</button>
        <button type="button" class="ptool-btn" id="pickerCollapse" title="Collapse sidebar">◀</button>
      </div>
    </div>
    <div class="picker-filter">
      <input id="pickerSearch" type="search" placeholder="Filter files…" aria-label="Filter files">
    </div>
    <div class="picker-tree" id="pickerTree"></div>
  </aside>
  <div class="resizer resizer-left" id="pickerResizer" role="separator" aria-orientation="vertical" aria-label="Resize files panel" tabindex="0" title="Drag to resize"></div>
  <button class="picker-open-tab" id="pickerOpenTab" title="Open files panel" aria-label="Open files panel" hidden>▶ Files</button>
  <div class="canvas-wrap" id="canvasWrap">
    <div class="graph" id="graphContainer" role="region" aria-label="Interactive graph visualizer"></div>
    <div class="graph sankey-canvas" id="sankeyContainer" role="region" aria-label="Stacked column Miller-Sankey flow visualizer" hidden style="position:absolute; inset:0; overflow:auto; background:var(--bg, #0d1012);"></div>
    <div class="edgestyle" id="edgeChips"><span class="cap">Edges</span></div>
    <div class="filterbar" id="filterBar">
      <div class="filter-group" style="border-right:1px solid var(--panel2, #242b30); padding-right:8px; margin-right:4px;">
        <span class="cap">Canvas</span>
        <button type="button" class="ptool-btn active" id="baseGalaxyBtn" title="2D WebGL Galaxy & Cosmos Canvas" style="font-size:11px; padding:2px 8px; background:var(--accent, #38bdf8); color:#0b0e11; font-weight:600;">🌌 Galaxy</button>
        <button type="button" class="ptool-btn" id="baseSankeyBtn" title="5-Column Stacked Lifecycle Flow Chart (ADRs → Specs → Code → Tests → Docs)" style="font-size:11px; padding:2px 8px;">📊 Stacked Flow</button>
      </div>
      <div class="filter-group">
        <span class="cap">Scope</span>
        <label class="scope-chip on" title="Toggle Code scope"><input type="checkbox" class="scope-cb" data-scope="code" checked><span class="sw sw-code"></span>code</label>
        <label class="scope-chip on" title="Toggle Docs scope"><input type="checkbox" class="scope-cb" data-scope="docs" checked><span class="sw sw-docs"></span>docs</label>
        <label class="scope-chip on" title="Toggle Specs scope"><input type="checkbox" class="scope-cb" data-scope="specs" checked><span class="sw sw-specs"></span>specs</label>
      </div>
      <div class="filter-group">
        <span class="cap">Exclude</span>
        <input id="excludeInput" class="filter-input" type="text" placeholder="e.g. test, vendor…" title="Comma-separated directories to exclude">
      </div>
      <div class="filter-group">
        <label class="scope-chip on" title="Render indirect edges between visible nodes across hidden intermediaries"><input type="checkbox" class="scope-cb" id="transitiveCb" checked><span class="sw sw-transitive"></span>transitive edges</label>
      </div>
      <div class="filter-group" id="galaxyViewGroup">
        <span class="cap">View</span>
        <label class="scope-chip on" id="aggregateChip" title="Aggregate functions and methods into parent file containers"><input type="checkbox" id="aggregateCb" checked>aggregate</label>
        <label class="scope-chip" id="bloomsChip" title="Toggle radiant cluster blooms and community badges"><input type="checkbox" id="bloomsCb">blooms</label>
        <label class="scope-chip on" id="rainbowChip" title="Toggle rainbow edge coloring by relation type"><input type="checkbox" id="rainbowCb" checked>rainbow</label>
        <label class="scope-chip on" id="rebounceChip" title="Re-bounce galaxy layout in simulation style when filters change (uncheck to hold node positions)"><input type="checkbox" id="rebounceCb" checked>re-bounce</label>
        <div class="weights-menu-wrap" style="position:relative; display:inline-block;">
          <button type="button" class="ptool-btn" id="contractionToggle" title="Configure Layout Engine & Edge Pull Weights" style="margin-left:4px; font-size:11px; padding:2px 8px;">☍ Pull: Coupled ▾</button>
          <div class="weights-popover" id="weightsMenu" hidden style="position:absolute; top:calc(100% + 6px); left:0; z-index:120; width:280px; background:var(--panel, #15181b); border:1px solid var(--panel2, #242b30); border-radius:8px; box-shadow:0 12px 32px rgba(0,0,0,0.55); padding:12px; font-size:12px; color:var(--ink, #e7e9ea);">
            <div style="font-weight:600; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
              <span>Layout & Physics Tuning</span>
              <button type="button" id="closeWeightsMenu" style="background:none; border:none; color:var(--muted, #8b9298); cursor:pointer; font-size:14px; line-height:1;">✕</button>
            </div>
            <div style="font-size:10.5px; color:var(--muted, #8b9298); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">Engine</div>
            <div class="engine-pills" style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px;">
              <button type="button" class="ptool-btn engine-btn" data-layout-engine="stress" title="Fast 2-Level Stress Majorization layout with inter-galaxy repulsion" style="font-size:10.5px; padding:2px 6px;">Stress</button>
              <button type="button" class="ptool-btn engine-btn" data-layout-engine="cosmos" title="ForceAtlas2 + Concentric Separation layout" style="font-size:10.5px; padding:2px 6px;">Cosmos (FA2)</button>
              <button type="button" class="ptool-btn engine-btn" data-layout-engine="d3" title="Original upstream D3-force layout with semantic spring resting lengths" style="font-size:10.5px; padding:2px 6px;">Classic D3</button>
            </div>
            <div style="font-size:10.5px; color:var(--muted, #8b9298); margin-bottom:6px; text-transform:uppercase; letter-spacing:0.5px;">Presets</div>
            <div class="preset-pills" style="display:flex; flex-wrap:wrap; gap:4px; margin-bottom:12px;">
              <button type="button" class="ptool-btn preset-btn" data-cosmos-preset="coupled" style="font-size:10.5px; padding:2px 6px;">Balanced (Coupled)</button>
              <button type="button" class="ptool-btn preset-btn" data-cosmos-preset="code" style="font-size:10.5px; padding:2px 6px;">Code-Centric</button>
              <button type="button" class="ptool-btn preset-btn" data-cosmos-preset="spec" style="font-size:10.5px; padding:2px 6px;">Spec / Requirements-Centric</button>
              <button type="button" class="ptool-btn preset-btn" data-cosmos-preset="doc" style="font-size:10.5px; padding:2px 6px;">Doc / ADR-Centric</button>
              <button type="button" class="ptool-btn preset-btn" data-cosmos-preset="directory" style="font-size:10.5px; padding:2px 6px;">Directory Tree</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:8px;">
              <div>
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:11px;">
                  <span>Code / Uses Pull</span><span id="valDependency" style="color:var(--amber, #fbbf24);">1.8</span>
                </div>
                <input type="range" id="sliderDependency" min="0" max="4" step="0.1" value="1.8" style="width:100%; cursor:pointer;">
              </div>
              <div>
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:11px;">
                  <span>Spec / Covers Pull</span><span id="valContract" style="color:var(--features, #10b981);">2.5</span>
                </div>
                <input type="range" id="sliderContract" min="0" max="4" step="0.1" value="2.5" style="width:100%; cursor:pointer;">
              </div>
              <div>
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:11px;">
                  <span>Doc / Influences Pull</span><span id="valAssociation" style="color:var(--docs, #a855f7);">2.0</span>
                </div>
                <input type="range" id="sliderAssociation" min="0" max="4" step="0.1" value="2.0" style="width:100%; cursor:pointer;">
              </div>
              <div>
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:11px;">
                  <span>Structure / Part-Of Pull</span><span id="valStructure" style="color:var(--accent, #38bdf8);">1.2</span>
                </div>
                <input type="range" id="sliderStructure" min="0" max="4" step="0.1" value="1.2" style="width:100%; cursor:pointer;">
              </div>
              <div>
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:11px;">
                  <span>Support Sink Pull</span><span id="valSupport" style="color:var(--muted, #8b9298);">0.15</span>
                </div>
                <input type="range" id="sliderSupport" min="0" max="1" step="0.05" value="0.15" style="width:100%; cursor:pointer;">
              </div>
              <div>
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:11px;">
                  <span>Cluster Gap (px)</span><span id="valClusterGap" style="color:var(--ink, #e7e9ea);">38</span>
                </div>
                <input type="range" id="sliderClusterGap" min="10" max="120" step="2" value="38" style="width:100%; cursor:pointer;">
              </div>
            </div>
            <div style="margin-top:12px; padding-top:8px; border-top:1px solid var(--edge, #2a3439); display:flex; align-items:center; justify-content:space-between;">
              <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:11px; user-select:none; color:var(--ink, #e7e9ea);">
                <input type="checkbox" id="toggleHeuristics" checked style="cursor:pointer;">
                <span>Auto-detect support & type sinks</span>
              </label>
              <button type="button" id="btnResetWeights" class="ptool-btn" style="font-size:10.5px; padding:2px 8px;">Reset</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="lcount" id="lcount"></div>
    <div class="legend" id="legend"></div>
    <div class="zoomctl">
      <button class="iconbtn" id="zin" aria-label="Zoom in">+</button>
      <button class="iconbtn" id="zout" aria-label="Zoom out">−</button>
      <button class="iconbtn" id="zreset" aria-label="Reset view">⟲</button>
    </div>
    <div class="emptytab" id="graphEmpty" hidden></div>
  </div>
  <div class="outline" id="outlineView" hidden>
    <div class="tree-wrap">
      <div class="filterbar outline-filter" id="outlineFilterBar">
        <div class="filter-group">
          <span class="cap">Scope</span>
          <label class="scope-chip on" title="Toggle Code scope"><input type="checkbox" class="scope-cb" data-outline-scope="code" checked><span class="sw sw-code"></span>code</label>
          <label class="scope-chip on" title="Toggle Docs scope"><input type="checkbox" class="scope-cb" data-outline-scope="docs" checked><span class="sw sw-docs"></span>docs</label>
          <label class="scope-chip on" title="Toggle Specs scope"><input type="checkbox" class="scope-cb" data-outline-scope="specs" checked><span class="sw sw-specs"></span>specs</label>
        </div>
        <div class="filter-group">
          <span class="cap">Exclude</span>
          <input id="outlineExcludeInput" class="filter-input" type="text" placeholder="e.g. test, vendor…" title="Comma-separated directories to exclude">
        </div>
      </div>
      <div class="tree" id="tree"></div>
    </div>
  </div>
  <div class="resizer" id="detailResizer" role="separator" aria-orientation="vertical" aria-label="Resize details panel" tabindex="0" title="Drag to resize"></div>
  <aside class="detail" id="detail"><div class="empty">Select a node to view details</div></aside>
</main>

<script type="module" src="/app.js"></script>
</body>
</html>
